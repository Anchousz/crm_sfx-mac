name: Build macOS app

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # macos-13 (Intel) выведен из эксплуатации GitHub в декабре 2025 —
    # job с этим лейблом висит вечно в очереди и никогда не стартует.
    # macos-15-intel — последний доступный бесплатный x86_64-раннер (до 08/2027):
    # x86_64-сборка работает нативно на Intel и через Rosetta 2 на Apple Silicon.
    runs-on: macos-15-intel
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install customtkinter openpyxl reportlab pillow pyinstaller

      - name: Make build script executable
        run: chmod +x build_mac.sh

      - name: Run build
        run: ./build_mac.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: SFX-CRM-Mac
          path: installer/SFX-CRM-*.dmg
